  <text x="30" y="150" font-size="14" style="opacity:0;animation:s0 14.0s infinite" xml:space="preserve"><tspan fill="#00ff9c">✓</tspan> <tspan fill="#e6edf3">CV lido</tspan>  <tspan fill="#7d8590">— experiência, formação e competências</tspan></text><text x="30" y="174" font-size="14" style="opacity:0;animation:s1 14.0s infinite" xml:space="preserve"><tspan fill="#00ff9c">✓</tspan> <tspan fill="#e6edf3">vaga analisada</tspan>  <tspan fill="#7d8590">— requisitos e palavras-chave</tspan></text><text x="30" y="198" font-size="14" style="opacity:0;animation:s2 14.0s infinite" xml:space="preserve"><tspan fill="#00ff9c">✓</tspan> <tspan fill="#e6edf3">compatibilidade calculada</tspan>  <tspan fill="#7d8590">— o que encaixa e o que falta</tspan></text><text x="30" y="222" font-size="14" style="opacity:0;animation:s3 14.0s infinite" xml:space="preserve"><tspan fill="#00ff9c">✓</tspan> <tspan fill="#e6edf3">CV reescrito</tspan>  <tspan fill="#7d8590">— só com dados reais do candidato</tspan></text><text x="30" y="246" font-size="14" style="opacity:0;animation:s4 14.0s infinite" xml:space="preserve"><tspan fill="#00ff9c">✓</tspan> <tspan fill="#e6edf3">candidatura enviada</tspan>  <tspan fill="#7d8590">— pelo Gmail do próprio utilizador</tspan></text>
