    .pulse { animation: pulse 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.75); } }
    @keyframes tp { 0%,2.143% { clip-path: inset(0 100% 0 0); } 11.000%,97.143% { clip-path: inset(0 0 0 0); opacity: 1; } 100% { opacity: 0; } } @keyframes s0 { 0%,14.286% { opacity: 0; } 15.357%,95.714% { opacity: 1; } 97.857%,100% { opacity: 0; } } @keyframes s1 { 0%,22.143% { opacity: 0; } 23.214%,95.714% { opacity: 1; } 97.857%,100% { opacity: 0; } } @keyframes s2 { 0%,30.000% { opacity: 0; } 31.071%,95.714% { opacity: 1; } 97.857%,100% { opacity: 0; } } @keyframes s3 { 0%,37.857% { opacity: 0; } 38.929%,95.714% { opacity: 1; } 97.857%,100% { opacity: 0; } } @keyframes s4 { 0%,45.714% { opacity: 0; } 46.786%,95.714% { opacity: 1; } 97.857%,100% { opacity: 0; } } .beam { animation: beam 2.2s ease-in-out infinite; } @keyframes beam { 0% { transform: translateY(0); opacity: 0; } 15%,85% { opacity: .9; } 100% { transform: translateY(96px); opacity: 0; } } .flow { stroke-dasharray: 4 6; animation: flow 1s linear infinite; } @keyframes flow { to { stroke-dashoffset: -20; } } @keyframes ok { 0%,54.286% { opacity: 0; } 55.357%,95.714% { opacity: 1; } 97.857%,100% { opacity: 0; } }
